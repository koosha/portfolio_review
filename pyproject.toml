[project]
name = "portfolio-review"
version = "0.2.0"
description = "Local Yahoo Finance collection and auditable monthly portfolio research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "exchange-calendars>=4.11,<5",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.65,<2"]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["portfolio_lab_project", "private"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
